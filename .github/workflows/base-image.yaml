name: Base Build Image
run-name: Base build image for branch ${{ github.ref_name }}

# Builds scripts/Dockerfile.u24 (all the third-party dependencies) and pushes
# it to the GitHub Container Registry.  The application pipeline then runs
# inside this image instead of rebuilding mongocxx et al. on every push.
on:
  push:
    branches: [main]
    paths:
      - scripts/Dockerfile.u24
      - .github/workflows/base-image.yaml
  # Monthly, to pick up Ubuntu security fixes and uAuthenticator changes.
  schedule:
    - cron: '0 6 1 * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  # GHCR requires lower case.
  IMAGE_NAME: ${{ github.repository_owner }}/cctreviewbackend-base

jobs:
  build-and-push:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    name: Build and push the Ubuntu 24.04 base image

    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v3

      - name: Log in to the GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # ubuntu24 is what the build pipeline pulls; the sha tag is
          # there to roll back to if a rebuild breaks something.
          tags: |
            type=raw,value=ubuntu24
            type=sha,prefix=ubuntu24-

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: scripts
          file: scripts/Dockerfile.u24
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
